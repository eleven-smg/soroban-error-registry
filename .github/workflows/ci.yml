name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node --test test/

      - name: Clean example must pass
        run: node bin/soroban-error-registry.js examples/clean

      - name: Broken example must fail
        run: |
          if node bin/soroban-error-registry.js examples/broken; then
            echo "Expected a non-zero exit code for examples/broken"
            exit 1
          fi
